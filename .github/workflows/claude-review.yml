name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Belt-and-braces against a hang: `claude -p` is Claude Code's
    # non-interactive print mode (no prompt to hang on), and this bounds the
    # whole job regardless.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Sync project
        run: uv sync

      - name: Run review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python 3_claude_code_configuration_and_workflows/main.py review \
            --mode auto \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --print

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-report
          path: 3_claude_code_configuration_and_workflows/output/
          if-no-files-found: ignore
